{% if device.customer_can_cancel %}
<form method="post" action="{% url 'core:customer_device_cancel' device.tracking_id %}" class="pt-cancel-form" onsubmit="return confirm('{{ device.tracking_id }} numaralı servis kaydınız iptal edilsin mi?\nBu işlem geri alınamaz.');">{% csrf_token %}
  <button type="submit" class="pt-btn pt-btn-danger">Kaydı iptal et</button>
</form>
{% endif %}
