{% if request.user.role != 'customer' %}<div class="nt-tools">
{% endif %}<div class="nt" id="nt">
  <button type="button" class="nt-btn" id="nt-btn" aria-haspopup="true" aria-expanded="false" aria-controls="nt-pop" aria-label="Bildirimler">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    <span class="nt-badge" id="nt-badge" {% if not unread_notifications %}hidden{% endif %}>{{ unread_notifications }}</span>
  </button>
  <div class="nt-pop" id="nt-pop" hidden>
    <div class="nt-pop-head"><strong>Bildirimler</strong>
      <form method="post" action="{% url 'core:notifications_mark_read' %}" id="nt-readall">{% csrf_token %}<button type="submit">Tümünü okundu say</button></form>
    </div>
    <div class="nt-perm" id="nt-perm" hidden>Yeni gelişmelerde tarayıcı bildirimi almak ister misiniz?<button type="button" id="nt-perm-btn">Tarayıcı bildirimlerini aç</button></div>
    <ul class="nt-list" id="nt-list"><li class="nt-empty">Yükleniyor…</li></ul>
    <a class="nt-all" href="{% url 'core:notifications_list' %}">Tümünü görüntüle</a>
  </div>
</div>
{% if request.user.role != 'customer' %}
  <button type="button" class="nt-theme" data-theme-toggle aria-pressed="false" aria-label="Koyu temaya geç" title="Koyu / açık tema">
    <svg class="tt-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="tt-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>{% endif %}
