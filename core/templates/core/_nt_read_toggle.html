{# Tek bir bildirimi okundu yapan buton / okunduysa «Okundu» etiketi. Kullanım: include with n=bildirim #}
{% if n.is_read %}<span class="nt-read-done"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Okundu</span>{% else %}<form method="post" action="{% url 'core:notification_mark_one' n.pk %}" class="nt-read-form" data-nt-read>{% csrf_token %}<button type="submit" class="nt-read-btn" title="Okundu olarak işaretle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Okundu olarak işaretle</button></form>{% endif %}
